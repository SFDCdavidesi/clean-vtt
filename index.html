<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpiador de Archivos VTT</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        input[type="file"] {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #004494;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Limpiador de Subtítulos VTT</h2>
        <p>Sube tu archivo <strong>.vtt</strong> para extraer únicamente el texto limpio.</p>
        
        <input type="file" id="fileInput" accept=".vtt">
        <br>
        <button onclick="procesarArchivo()">Convertir y Descargar TXT</button>
    </div>

    <script>
        function procesarArchivo() {
            const input = document.getElementById('fileInput');
            if (input.files.length === 0) {
                alert('Por favor, selecciona un archivo .vtt primero.');
                return;
            }

            const file = input.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const contenido = e.target.result;
                const textoLimpio = limpiarVTT(contenido);
                
                // Generar el nombre de archivo de salida
                const nombreSalida = file.name.replace(/\.[^/.]+$/, "") + "_limpio.txt";
                descargarTXT(textoLimpio, nombreSalida);
            };

            reader.readAsText(file);
        }

        function limpiarVTT(texto) {
            const lineas = texto.split('\n');
            const lineasLimpias = [];

            for (let linea of lineas) {
                linea = linea.trim();
                
                // Ignorar la cabecera WEBVTT
                if (linea === 'WEBVTT') continue;
                // Ignorar líneas vacías
                if (linea === '') continue;
                // Ignorar líneas de tiempo (ej. 00:03:58.160 --> 00:03:59.200)
                if (linea.includes('-->')) continue;
                // Ignorar identificadores UUID (ej. 40391bfc-350a-480c-afc4-32dfe4519a79-0)
                if (/^[a-fA-F0-9\-]+-\d+$/.test(linea)) continue;

                // Añadir el texto válido
                lineasLimpias.push(linea);
            }

            // Unir el texto con un espacio para crear párrafos continuos
            return lineasLimpias.join(' ');
        }

        function descargarTXT(texto, nombreArchivo) {
            const blob = new Blob([texto], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            a.href = url;
            a.download = nombreArchivo;
            document.body.appendChild(a);
            a.click();
            
            // Limpieza
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
